name: Release

# On a tag v*: build the ScarlettPort runtime, assemble the ZIP (top level: scarlett.exe, its
# D3D12\ folder, SCARLETT_COMMIT.txt, README.txt and the licences), write SHA-256 checksums and
# publish a release. Players run it through SixLauncher (https://github.com/SixLauncher/launcher).
# No binaries are committed to the repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  AGILITY_VERSION: 1.614.1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # engine/rust-toolchain.toml pins its toolchain; rustup installs it on first use.
      - name: Build the ScarlettPort runtime
        working-directory: engine
        run: cargo rustc --release -p scarlett --bin scarlett --features diagnostics --locked -- -C link-arg=/EXPORT:D3D12SDKVersion,DATA -C link-arg=/EXPORT:D3D12SDKPath,DATA

      - name: Fetch the D3D12 Agility SDK (Microsoft, NuGet)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'agility'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/$env:AGILITY_VERSION" -OutFile "$tmp\agility.zip"
          Expand-Archive "$tmp\agility.zip" -DestinationPath $tmp -Force
          "AGILITY_BIN=$tmp\build\native\bin\x64" | Out-File -Append $env:GITHUB_ENV

      - name: Assemble the ZIP and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $root = Join-Path $env:RUNNER_TEMP "ScarlettPort-$tag"
          New-Item -ItemType Directory -Force (Join-Path $root 'D3D12') | Out-Null
          Copy-Item engine\target\release\scarlett.exe $root
          Copy-Item "$env:AGILITY_BIN\D3D12Core.dll" (Join-Path $root 'D3D12')
          Copy-Item "$env:AGILITY_BIN\d3d12SDKLayers.dll" (Join-Path $root 'D3D12')
          Copy-Item LICENSE.md $root
          Copy-Item engine\LICENSE (Join-Path $root 'LICENSE-runtime.txt')
          Copy-Item engine\UPSTREAM.md (Join-Path $root 'UPSTREAM.md')
          Copy-Item CREDITS.md $root
          "${{ github.sha }}" | Set-Content (Join-Path $root 'SCARLETT_COMMIT.txt')
          @"
          ScarlettPort $tag: the runtime (scarlett.exe) and the D3D12 Agility SDK it loads from D3D12\.

          Play with SixLauncher (https://github.com/SixLauncher/launcher): choose ScarlettPort as the
          backend and this folder's scarlett.exe as its executable, or let SixLauncher install a build.
          Keep the D3D12 folder beside scarlett.exe.

          You need your own dump of your own legally obtained copy; no game files are included.
          Source and instructions: https://github.com/${{ github.repository }}
          "@ | Set-Content (Join-Path $root 'README.txt')
          $files = Get-ChildItem $root -Recurse -File | Sort-Object FullName
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($root.Length + 1).Replace('\', '/') }
          $sums | Set-Content (Join-Path $root 'SHA256SUMS.txt')
          $zip = "ScarlettPort-$tag-win64.zip"
          Compress-Archive -Path "$root\*" -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $zip" | Set-Content SHA256SUMS.txt
          $sums | Add-Content SHA256SUMS.txt
          $exeHash = (Get-FileHash (Join-Path $root 'scarlett.exe') -Algorithm SHA256).Hash.ToLower()
          @"
          One ZIP: ``scarlett.exe`` (the ScarlettPort runtime, GPL-3.0; lineage in UPSTREAM.md) and the Microsoft D3D12 Agility SDK DLLs in ``D3D12\`` beside it. Extract the whole ZIP and keep the two together. Play it with [SixLauncher](https://github.com/SixLauncher/launcher): choose ScarlettPort as the backend and this ``scarlett.exe``, then **Preparar shaders** once. You need your own dump of your own legally obtained copy; no game files are included.

          Built from ``${{ github.sha }}`` by the [Release workflow](https://github.com/${{ github.repository }}/actions/workflows/release.yml).

          ### New in this release
          What changed is listed under this version's "New in" section of the README.

          ### Shader build
          ``scarlett prepare`` (SixLauncher's **Preparar shaders**) translates every shader and makes the pipelines earlier runs recorded, on all cores but one; it resumes where it stopped. An update that does not change the translator only re-checks the cache; one that does translates what is new.

          ### Verify the download
          These files are **not code-signed**, so Windows SmartScreen may warn on first run ("More info", then "Run anyway"). Compare the SHA-256 before running:

          | File | SHA-256 |
          |---|---|
          | ``$zip`` | ``$zipHash`` |
          | ``scarlett.exe`` | ``$exeHash`` |

          ``SHA256SUMS.txt`` lists every file. In PowerShell: ``Get-FileHash .\$zip -Algorithm SHA256``.

          ### If your antivirus flags it
          A new unsigned build can be flagged by heuristics. Please report it as a false positive to Microsoft at https://www.microsoft.com/en-us/wdsi/filesubmission (choose "Incorrectly detected as malware/malicious"), and open an issue with the detection name so we can track it.
          "@ | Set-Content notes.md
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" SHA256SUMS.txt --title "ScarlettPort ${{ github.ref_name }}" --notes-file notes.md --latest
